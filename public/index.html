<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>zcode-monitor</title>
<link rel="stylesheet" href="/styles.css">
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.4/dist/chart.umd.min.js"></script>
<script>
  // Apply saved theme before paint to avoid a flash of the wrong theme.
  (function () {
    try {
      var t = localStorage.getItem('zc-theme');
      // allow ?theme=light|dark override for testing / linking
      var q = new URLSearchParams(location.search).get('theme');
      if (q === 'light' || q === 'dark') t = q;
      if (t !== 'light' && t !== 'dark') t = 'dark';
      document.documentElement.setAttribute('data-theme', t);
    } catch (e) {
      document.documentElement.setAttribute('data-theme', 'dark');
    }
  })();
</script>
</head>
<body>
<div class="app">
  <header class="topbar">
    <div class="brand"><span class="dot" id="status-dot"></span> zcode-monitor</div>
    <nav class="nav" id="nav">
      <a data-view="overview">实时监控</a>
      <a data-view="sessions">会话</a>
      <a data-view="agents">子 Agent</a>
      <a data-view="errors">错误与链路</a>
      <a data-view="raw">原始数据</a>
      <a data-view="how">运行原理</a>
    </nav>
    <div class="spacer"></div>
    <div class="meta" id="topbar-meta">—</div>
    <button class="btn ghost" id="checkpoint-btn" title="把 WAL 数据合并进主库，确保 ZCode 关闭后历史可读" aria-label="合并 WAL">
      <span id="checkpoint-icon">💾</span>
    </button>
    <button class="btn ghost theme-toggle" id="theme-toggle" title="切换主题" aria-label="切换主题">
      <span id="theme-icon">🌙</span>
    </button>
  </header>
  <div class="privacy-notice" id="privacy-notice" hidden>
    <span class="privacy-notice-tag">隐私提示</span>
    <span class="privacy-notice-text">
      有第三方报告称 ZCode 可能会在后台上传工作区快照（涉及 <code>~/.zcode/v2/checkpoints/</code>）。
      该说法<strong>未经我们验证</strong>；本工具对 <code>~/.zcode/</code> 全程只读，不会上传任何数据。
      自查（只读列目录，PowerShell）：<code>Get-ChildItem "$env:USERPROFILE\.zcode\v2\checkpoints"</code>，来源汇总见 README「隐私提示」。
    </span>
    <button class="privacy-notice-close" id="privacy-notice-close" type="button" title="不再显示" aria-label="关闭隐私提示">×</button>
  </div>
  <script>
    // 隐私提示条：默认隐藏，未关闭过则展示；点击关闭写入 localStorage，之后不再出现。
    // localStorage 不可用（隐私模式等）时仅影响记忆，本次会话仍可关闭。
    (function () {
      var KEY = 'zc-privacy-notice-dismissed';
      var bar = document.getElementById('privacy-notice');
      var btn = document.getElementById('privacy-notice-close');
      if (!bar || !btn) return;
      try {
        if (localStorage.getItem(KEY) !== '1') bar.hidden = false;
      } catch (e) { bar.hidden = false; }
      btn.addEventListener('click', function () {
        bar.hidden = true;
        try { localStorage.setItem(KEY, '1'); } catch (e) { /* ignore */ }
      });
    })();
  </script>
  <main id="root"></main>
</div>
<div id="toast" class="toast" hidden></div>
<script src="/app.js"></script>
<script src="/views/overview.js"></script>
<script src="/views/sessions.js"></script>
<script src="/views/timeline.js"></script>
<script src="/views/agents.js"></script>
<script src="/views/errors.js"></script>
<script src="/views/raw.js"></script>
<script src="/views/how.js"></script>
</body>
</html>
