<!DOCTYPE html>
<!-- ═══════════════════════════════════════════════════════════════════════
     SPRITE ATTRIBUTION
     Pet sprite pack "月薪喵" (yuexinmiao):
       Source:  github.com/Renakoni/dsh-desk, via Masterchiefm/zcode-speed-panel
       License: MIT License, Copyright (c) 2026 Renakoni
     Sprites are served locally from /pets/yuexinmiao/spritesheet.webp —
     this page makes no external requests for them.
     ═══════════════════════════════════════════════════════════════════════

     token-speed desktop pet — sprite edition (Codex Pet pack format).
     One file, TWO window sizes (mini companion 80×100 CSS / normal card
     160×190 CSS — typography scales via container queries): a <canvas>
     draws the cat from the local spritesheet with the same approach as
     upstream's PetWidget (rAF + drawImage per frame), a small S2 speech
     bubble above carries the live number + unit permanently (the pet's
     only speed readout), and ONE mood function drives which row plays
     (priority high→low — a single decision, no competing timers):
       error   (SSE tool_error edge, 4s hold)  → row5 failed
       tantrum (4+ rapid clicks, 1.5s hold)    → row5 failed (upset cat)
       gen     (SSE /api/gen/events phase)     → tier-picked run group:
              < 30 t/s  → row7 running
             30-80 t/s  → row4 jumping
             > 80 t/s   → row1/row2 alternating each full cycle
       sleep   (60s without agent activity)    → row0 idle frozen frame
               + CSS breathing + zzz (no dedicated row: 9-row contract)
       cruise  (activity inside the sleep window) → row8 review loop
     waiting_permission keeps a reserved rung between gen and sleep — no
     signal source exists yet (see computeMood() for the wiring note).
     Upstream rule kept verbatim: switch animations only at the END of a full
     row cycle, so the cat never pops mid-motion.
     Data: poll GET /api/widget/recent every 5 s → rolling tps over the
     returned 5-minute population (Σ(output+reasoning) ÷ Σduration_ms/1000).
     All endpoints are optional: with everything dead this page is an idle
     cat, which IS the product's default face.
     Shell: frameless WebView2 rounded card (transparency impossible); the
     page paints full-bleed --surface-card and the window region owns the
     radius. Affordances mirror widget.html exactly: drag anywhere ·
     right-click menu · double/triple-click next pet · 4+ rapid clicks
     tantrum (no switch) · wheel cycles forms. -->
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Token 桌宠</title>
<style>
/* Font import matches widget.html (Source Sans 3 is the family face) and is
   the page's only network dependency besides same-origin APIs/sprites.
   Placed first so the @import is valid CSS. */
@import url('https://fonts.googleapis.com/css2?family=Source+Sans+3:wght@400;500;600&family=Noto+Sans+SC:wght@400;500;700&display=swap');

/* Spectrum 2 tokens (subset, from Ke-Spectrum-2-Design-System/tokens/) —
   identical to widget.html so pill and pet read as one product */
:root {
  color-scheme: light dark;
  --font-sans: "Source Sans 3", "Noto Sans SC", ui-sans-serif, system-ui, "Segoe UI", "Microsoft YaHei", sans-serif;

  --surface-card: light-dark(#ffffff, #222222);
  --text-heading: light-dark(#131313, #f2f2f2);
  --text-secondary: light-dark(#505050, #afafaf);
  --text-disabled: light-dark(#8f8f8f, #6d6d6d);
  --negative: light-dark(#d73220, #df3422);
  --accent: light-dark(#3b63fb, #8ea5fb); /* Spectrum 2 blue — the ×N lane badge */
  --notice: light-dark(#fc7d00, #e06400);
  --positive: light-dark(#05834e, #068850);

  --bubble-bg: light-dark(#ffffff, #303030);
  --bubble-line: light-dark(#d0d0d0, #4d4d4d);
  --tier: var(--text-disabled); /* neutral until data assigns a tier */
}

/* same tier boundaries as widget.html speedClass(): <30 red / 30-80 amber /
   >80 green — the bubble number color (and the gen run animation pick) are
   the only tier carriers on this page */
body.tier-red   { --tier: var(--negative); }
body.tier-amber { --tier: var(--notice); }
body.tier-green { --tier: var(--positive); }

* { margin: 0; padding: 0; box-sizing: border-box; }
html, body { height: 100%; overflow: hidden; }
body {
  background: var(--surface-card); /* full-bleed: the window region owns the card radius */
  border-radius: 16px;             /* cosmetic in a plain browser only; no-op inside the shell */
  font-family: var(--font-sans);
  user-select: none;
  -webkit-user-select: none;
  cursor: default;
  position: relative;
  /* ONE page serves TWO window sizes (mini companion + normal pet card);
     bubble typography scales off the card width instead of fixed px */
  container-type: inline-size;
}

/* cat canvas: bottom-anchored, ~80% of card height, sheet cell aspect */
#pet {
  position: absolute;
  bottom: 0;
  left: 50%;
  transform: translateX(-50%);
  height: 80%;
  aspect-ratio: 192 / 208;
  pointer-events: none; /* document-level drag/menu handlers stay authoritative */
}

/* bubble zone: the ~20% band above the cat; the bubble hovers at its bottom
   edge so the tail points at the cat's head */
.bubble-zone {
  position: absolute;
  top: 0; left: 0; right: 0;
  height: 20%;
  display: flex;
  align-items: flex-end;
  justify-content: center;
  pointer-events: none;
}
.bubble {
  background: var(--bubble-bg);
  border: 1px solid var(--bubble-line);
  border-radius: 0.55em;
  box-shadow: 0 1px 4px light-dark(rgb(0 0 0 / .12), rgb(0 0 0 / .5));
  padding: 0.12em 0.55em 0.2em;
  font-family: var(--font-sans);
  font-weight: 600;
  /* number scales with the card: ~8px on the mini companion, 13.5px on the
     normal card — em-based paddings/radius follow, so the whole bubble
     scales as one object instead of fixed px breaking the mini size */
  font-size: clamp(8px, 8.5cqw, 13.5px);
  line-height: 1.25;
  font-variant-numeric: tabular-nums;
  color: var(--tier);       /* tier color with a number, neutral gray for "…" */
  white-space: nowrap;
  position: relative;
  opacity: 0;
  transform: translateY(3px);
  transition: opacity .18s ease, transform .18s ease;
}
.bunit { /* "t/s" — quieter than the number, same family/weight */
  font-size: 0.72em;
  font-weight: 600;
  color: var(--text-secondary);
  margin-left: 0.25em;
}
.blanes { /* "×5" — live concurrent-lane count, ≥2 lanes only; accent marks
             it as the multiplier of the per-lane number beside it */
  font-size: 0.72em;
  font-weight: 600;
  color: var(--accent);
  margin-left: 0.3em;
}
.bubble::after { /* little tail: rotated square with two exposed borders */
  content: "";
  position: absolute;
  left: 50%;
  bottom: -0.26em;
  width: 0.48em;
  height: 0.48em;
  background: var(--bubble-bg);
  border-right: 1px solid var(--bubble-line);
  border-bottom: 1px solid var(--bubble-line);
  transform: translateX(-50%) rotate(45deg);
}
.bubble.on { opacity: 1; transform: translateY(0); }

/* reduced motion: the sprite loop stops (one static representative frame is
   drawn per state instead) and the bubble crossfades without translation */
@media (prefers-reduced-motion: reduce) {
  .bubble { transition: opacity .18s ease; }
  body.state-sleep #pet, body.state-sleep .bubble-zone::after { animation: none; }
}

/* sleep: no dedicated animation row (the 9-row contract stands) — step()
   freezes on the row0 idle first frame and this class adds the life signs:
   a gentle breathing scale (keyframes must carry the layout translateX) and
   a quiet zzz marker beside the bubble */
body.state-sleep #pet { animation: pet-breathe 3.2s ease-in-out infinite; }
@keyframes pet-breathe {
  0%, 100% { transform: translateX(-50%) scale(1); }
  50%      { transform: translateX(-50%) scale(0.965); }
}
body.state-sleep .bubble-zone::after {
  content: "zzz";
  font-weight: 600;
  color: var(--text-disabled);
  font-size: clamp(8px, 8.5cqw, 13.5px);
  margin-left: 4px;
  animation: pet-zzz 3.2s ease-in-out infinite;
}
@keyframes pet-zzz {
  0%, 100% { opacity: .45; }
  50%      { opacity: .9; }
}
</style>
</head>
<body class="state-idle">
<canvas id="pet" role="img" aria-label="Token 桌宠：打盹中"></canvas>
<div class="bubble-zone">
  <div class="bubble" id="bubble"><span id="bnum">…</span><span class="bunit" id="bunit">t/s</span><span class="blanes" id="blanes" hidden></span></div>
</div>

<!-- 消毒模块：气泡类展示的文本闸门（当前气泡只显示数值，见 render() 内契约注释；
     任何未来文本展示必须经 SanitizeSpeech.sanitizeSpeech） -->
<script src="/sanitize.js"></script>
<script>
'use strict';
const IN_WEBVIEW = !!(window.chrome && window.chrome.webview);
// 统一活动时钟：入睡只有这一个判定（旧 IDLE_AFTER 2 分钟 idle 态由 sleep 取代，
// 两套计时器合一）。lastActive 由三个来源共同推进——完成的流量（poll）、生成/
// 失败边（SSE）、用户手势（点击）——任何一个都能惊醒或续命。
const SLEEP_AFTER_MS = 60 * 1000;  // 60s 无 agent 活动入睡
const ERROR_HOLD_MS  = 4 * 1000;   // 工具失败后 failed 行的可见时长
const COMBO_HOLD_MS  = 1500;       // 连击发脾气（failed 行）的可见时长
const GESTURE_WINDOW_MS = 500;     // click 手势判定窗口（≈Windows 默认双击时长）
const GEN_STALE  = 10 * 60 * 1000; // see staleness guard in poll()

const $ = id => document.getElementById(id);
const petEl = $('pet'), bubbleEl = $('bubble'), bnumEl = $('bnum'), bunitEl = $('bunit'), blanesEl = $('blanes');
const reduceMQ = window.matchMedia('(prefers-reduced-motion: reduce)');

// ── sprite packs: Codex Pet format. The registry comes from the server
//    (/api/pets scans public/pets/*) — adding a pet is dropping a folder;
//    pet.json beside each sheet carries the display name only.
//    Double-click the pet cycles packs; choice persists in localStorage. ──
const CELL_W = 192, CELL_H = 208, COLS = 8, FRAME_MS = 160;
// standard contract: the first 9 rows are these anims, in this order
const ROW_ANIMS = ['idle', 'running_right', 'running_left', 'waving', 'jumping',
                   'failed', 'waiting_permission', 'running', 'review'];
// hand-tuned exceptions the pixel scan can't see (cells that are non-blank
// but visually broken/oversized); everything else is derived from the sheet
const PACK_OVERRIDES = {
  'maid-deepseek-whale': { review: [0, 1, 2, 3, 0] }, // upstream skips a broken col 4 and an oversized 5
};
let PACKS = [];   // [{id, name, sheet}] from /api/pets
let packIdx = 0;
let pack = null;  // active pack
let ANIMS = null; // { anim: {row, play:[cols]} } built per pack from the sheet

// ── canvas rendering (same approach as upstream PetWidget) ────────────────
const ctx = petEl.getContext('2d');
let sheetOk = false;
let anim = 'idle';     // row currently playing
let pending = 'idle';  // queued row; applied only at a full-cycle boundary
let frame = 0;         // index within the current row's play list
let rafId = 0, lastTs = 0;

// sheet loads/restarts are owned by applyPack() below
const sheet = new Image();

// Backing store at physical pixels (devicePixelRatio is 2 at the shell's
// 200% DPI) so the 192×208 cells stay crisp; CSS layout owns the size.
function fitCanvas() {
  const r = petEl.getBoundingClientRect();
  const dpr = window.devicePixelRatio || 1;
  petEl.width  = Math.max(1, Math.round(r.width  * dpr));
  petEl.height = Math.max(1, Math.round(r.height * dpr));
  ctx.imageSmoothingEnabled = true;
  ctx.imageSmoothingQuality = 'high';
  if (sheetOk && ANIMS) draw(anim, frame);
}
window.addEventListener('resize', fitCanvas);

function draw(name, idx) {
  const a = ANIMS?.[name];
  if (!a) return;
  const col = a.play[idx] ?? a.play[0] ?? 0;
  // clear first: cat frames sit at different offsets inside the cell, so
  // drawing over the previous frame left ghost outlines behind (vision-caught)
  ctx.clearRect(0, 0, petEl.width, petEl.height);
  // 1px source inset: at ~6x upscaling with smoothing on, edge texels sample
  // the NEIGHBOURING cell of the sheet and bleed its pixels (magenta specks)
  // into this frame — cropping the outermost source pixel kills the bleed
  ctx.drawImage(sheet, col * CELL_W + 1, a.row * CELL_H + 1, CELL_W - 2, CELL_H - 2,
                0, 0, petEl.width, petEl.height);
}

function step() {
  if (asleep) { draw('idle', 0); return; } // 入睡 = 静帧 + CSS 呼吸，非动画行（9 行契约不动）
  const a = ANIMS[anim];
  if (++frame >= a.play.length) {
    frame = 0;
    // upstream rule: switch rows only after the last frame of a cycle, so
    // the cat never pops mid-motion; high tier also alternates direction
    // here, one full cycle each way
    if (pending !== anim) anim = pending;
    else if (anim === 'running_right') anim = pending = 'running_left';
    else if (anim === 'running_left')  anim = pending = 'running_right';
  }
  draw(anim, frame);
}

let lastBeat = 0;  // last advance (rAF or fallback) — watchdog input
let fallbackId = 0;

function loop(ts) {
  rafId = requestAnimationFrame(loop);
  if (ts - lastTs < FRAME_MS) return; // pace to 160ms/frame regardless of rAF rate
  lastTs = ts;
  lastBeat = performance.now();
  step();
}
function startAnim() {
  if (reduceMQ.matches) { if (sheetOk) draw(anim, 0); return; }
  if (!rafId) {
    lastTs = 0; lastBeat = performance.now();
    rafId = requestAnimationFrame(loop);
    // Chromium treats never-activated tool windows as occluded and stops rAF
    // entirely (the cat froze solid in the WebView2 shell). This watchdog
    // drives the frames instead whenever rAF starves, and is a no-op while
    // rAF is alive.
    if (!fallbackId) fallbackId = setInterval(() => {
      if (reduceMQ.matches || performance.now() - lastBeat < 700) return;
      lastBeat = performance.now();
      step();
    }, 250);
  }
}

// Pixel-scan one row of the sheet: sample every cell at 1/8 scale into an
// offscreen canvas and keep the columns that actually contain sprite pixels.
// Artists pad short rows with fully transparent columns — stepping into one
// would flash an empty frame — and pet.json carries no frame table, so the
// sheet itself is the only source of truth. Sheets with opaque backgrounds
// simply scan as "all 8" (the pre-scan behavior).
const SCAN_W = 24, SCAN_H = 26;
let scanCanvas = null;
function scanRow(row) {
  if (!scanCanvas) scanCanvas = document.createElement('canvas');
  scanCanvas.width = SCAN_W; scanCanvas.height = SCAN_H;
  const sctx = scanCanvas.getContext('2d', { willReadFrequently: true });
  const cols = [];
  for (let col = 0; col < COLS; col++) {
    sctx.clearRect(0, 0, SCAN_W, SCAN_H);
    sctx.drawImage(sheet, col * CELL_W, row * CELL_H, CELL_W, CELL_H,
                   0, 0, SCAN_W, SCAN_H);
    const d = sctx.getImageData(0, 0, SCAN_W, SCAN_H).data;
    let ink = 0;
    for (let i = 3; i < d.length; i += 4) if (d[i] > 16) ink++;
    if (ink > SCAN_W * SCAN_H * 0.005) cols.push(col);
  }
  return cols.length ? cols : [0];
}

function buildAnims() {
  ANIMS = {};
  for (let row = 0; row < ROW_ANIMS.length; row++) {
    const name = ROW_ANIMS[row];
    const ov = (PACK_OVERRIDES[pack.id] || {})[name];
    ANIMS[name] = { row, play: ov || scanRow(row) };
  }
}

// Apply a pack: swap the sheet, derive the anim table from its pixels,
// restart the loop on load. A failed sheet load used to leave the canvas
// blank forever (onerror was silent) — the exact "切换宠物后空白" bug. Now:
// retry once with a cache-buster (stalled/partial cache entries heal), and
// if it still fails REVERT to the pack that was on screen, so the pet never
// disappears. prevIdx=null (boot, or a revert already in flight) means no
// revert hop.
function applyPack(idx, prevIdx) {
  packIdx = idx;
  pack = PACKS[packIdx];
  ANIMS = null; // rebuilt from the new sheet's pixels on load
  try { localStorage.setItem('petPack', pack.id); } catch { /* private mode */ }
  sheetOk = false;
  anim = pending = 'idle';
  frame = 0;
  let retried = false;
  sheet.onload = () => {
    sheetOk = true;
    try { buildAnims(); }
    catch (e) { console.error('[pet] anim scan failed: ' + e); }
    fitCanvas();
    startAnim();
  };
  sheet.onerror = () => {
    if (!retried) {
      retried = true;
      sheet.src = pack.sheet + '?r=' + Date.now();
      return;
    }
    console.error('[pet] spritesheet failed twice, reverting: ' + pack.sheet);
    if (prevIdx != null && prevIdx !== packIdx) applyPack(prevIdx, null);
  };
  sheet.src = pack.sheet;
}
function cyclePack() {
  if (PACKS.length < 2 || !pack) return;
  applyPack((packIdx + 1) % PACKS.length, packIdx);
}
// boot: the registry comes from the server; until it answers (or forever, if
// unreachable) the card is just an empty pet seat — the bubble + data still run
(async function initPacks() {
  try {
    const r = await fetch('/api/pets', { cache: 'no-store' });
    if (r.ok) PACKS = await r.json();
  } catch { /* server down: keep the fallback below */ }
  if (!Array.isArray(PACKS) || !PACKS.length) {
    PACKS = [{ id: 'yuexinmiao', name: '月薪喵', sheet: '/pets/yuexinmiao/spritesheet.webp' }];
  }
  packIdx = Math.max(0, PACKS.findIndex(p => p.id === localStorage.getItem('petPack')));
  applyPack(packIdx, null);
})();
function stopAnim() { if (rafId) { cancelAnimationFrame(rafId); rafId = 0; } }
// honor the OS setting toggling at runtime, not just at load
reduceMQ.addEventListener('change', () => {
  if (reduceMQ.matches) { stopAnim(); if (sheetOk && ANIMS) draw(anim, 0); }
  else startAnim();
});

// ── rolling state ─────────────────────────────────────────────────────────
let tps = null;              // rolling tps over the last-5-min population, or null
let lastActive = Date.now(); // 统一活动时钟（epoch ms）：流量/生成边/失败/点击都推进它
let gen = false;         // true between SSE gen:start and gen:end
let lanes = 0;           // concurrent in-flight sessions (≥2 → ×N badge)
let genLastAt = 0;       // time of the last gen event, for the staleness guard
let errorHoldUntil = 0;  // 工具失败后 failed 行的 hold 截止时刻
let comboHoldUntil = 0;  // 连击发脾气（failed 行）的 hold 截止时刻
let asleep = false;      // render() 派生；step() 据此冻结在 idle 首帧
let sseSeenEvent = false;
let es = null;
let curMood = '', curTier = '';

function tierOf(t) { // same boundaries as widget.html speedClass()
  if (t == null || !isFinite(t)) return '';
  if (t < 30) return 'tier-red';
  if (t <= 80) return 'tier-amber';
  return 'tier-green';
}

// 单一心情判定（优先级从高到低，见文件头注）：
//   error > tantrum > generating > waiting_permission（预留位次）> sleep > cruise
// 入睡只查这一个时钟（now - lastActive），与旧 IDLE_AFTER 2 分钟判定合并——
// 不存在第二套计时器。
// waiting_permission 预留说明（未接线）：/api/live 与 /api/gen/state 目前都
// 拿不到权限信号——2026-09-22 只读实测：tool_usage.approval_status 尾部取值
// 全 'none'、permission 表 max rowid 0（与计划核实门快照一致）。出现信号源后
// 接线三步：SSE 分派里加 permHoldUntil = Date.now() + ERROR_HOLD_MS；本函数
// gen 之后插入 `if (now < permHoldUntil) return 'permission';`；animFor 已备好
// 'waiting_permission' 行，无需再改。
function computeMood() {
  const now = Date.now();
  if (now < errorHoldUntil) return 'error';   // 系统报错：优先于一切（生成中也先报错）
  if (now < comboHoldUntil) return 'tantrum'; // 用户互动反馈，短暂压过后台生成画面
  if (gen) return 'gen';
  if (now - lastActive >= SLEEP_AFTER_MS) return 'sleep';
  return 'cruise';
}

// 心情 → 行映射。gen 档位沿用上游词汇（3 档）：low → running、mid → jumping、
// high → running_right（每整帧循环与 running_left 交替）；无数字 → 中速 running。
// error 与 tantrum 共用 failed 行：系统报错与「被惹恼了」在这批像素包里是同一
// 个懊恼动画，语义都成立，不新增行（9 行契约不动）。
function animFor(mood) {
  if (mood === 'error' || mood === 'tantrum') return 'failed';
  if (mood === 'permission') return 'waiting_permission'; // 预留，见 computeMood
  if (mood === 'gen') {
    if (tps == null || !isFinite(tps) || tps < 30) return 'running';
    if (tps <= 80) return 'jumping';
    return 'running_right';
  }
  if (mood === 'sleep') return 'idle'; // step() 冻结在首帧 + CSS 呼吸，非循环
  return 'review';                     // cruise
}

function ariaLabel(s) {
  if (s === 'error')   return 'Token 桌宠：工具出错了';
  if (s === 'tantrum') return 'Token 桌宠：被惹恼了';
  if (s === 'gen')     return tps != null ? 'Token 桌宠：生成中，速度 ' + tps.toFixed(1) + ' t/s'
                                          : 'Token 桌宠：生成中';
  if (s === 'sleep')   return 'Token 桌宠：睡着了';
  return 'Token 桌宠：待命中';
}

function render() {
  const mood = computeMood(), tier = tierOf(tps);
  asleep = mood === 'sleep';
  if (mood !== curMood || tier !== curTier) {
    curMood = mood; curTier = tier;
    document.body.className = ('state-' + mood + ' ' + tier).trim();
    petEl.setAttribute('aria-label', ariaLabel(mood));
  }
  pending = animFor(mood); // queued; the loop applies it at the cycle boundary
  if (reduceMQ.matches && sheetOk) draw(pending, 0); // static face, no loop
  // the bubble is the pet's only speed readout (mini form has nothing else),
  // so it stays up permanently: live number + unit, or "…" until one exists.
  // 消毒契约（既定决策）：本气泡默认不展示 agent 原始文本，只显示数值
  // （toFixed/×N），故此处无需过闸；任何未来文本类展示点必须先经
  // window.SanitizeSpeech.sanitizeSpeech()（sanitize.js，本页已引入）。
  const hasNum = tps != null && isFinite(tps);
  bnumEl.textContent = hasNum ? tps.toFixed(1) : '…';
  bunitEl.style.display = hasNum ? '' : 'none';
  // lane badge is independent of the number: "… ×5" while streams warm up.
  // Readability floor (vision-caught): the mini form's bubble clamps to 8px,
  // where a 0.72em ×N is a 4px-tall blob — below 10px number size the badge
  // hides instead of smearing. Normal form (13.5px) always qualifies.
  blanesEl.hidden = lanes < 2 || parseFloat(getComputedStyle(bnumEl).fontSize) < 10;
  if (!blanesEl.hidden) blanesEl.textContent = '×' + lanes;
  bubbleEl.classList.add('on');
}

// ── data: poll /api/widget/recent every 5 s ────────────────────────────────
// The endpoint returns the exact rolling-window population (completed in the
// last 5 min), so the number is just Σtokens ÷ Σduration over the response.
// Rows are keyed by completion time (time + duration_ms) for the idle clock.
async function poll() {
  try {
    const r = await fetch('/api/widget/recent', { cache: 'no-store' });
    if (!r.ok) throw new Error('http ' + r.status);
    const rows = await r.json();
    if (Array.isArray(rows)) {
      let tok = 0, ms = 0, lastEnd = 0;
      for (const q of rows) {
        const end = new Date(q.time).getTime() + (q.duration_ms || 0);
        if (end > lastEnd) lastEnd = end; // NaN rows drop out via comparison
        if (q.duration_ms > 0) {
          tok += (q.output || 0) + (q.reasoning || 0);
          ms += q.duration_ms;
        }
      }
      lastActive = Math.max(lastActive, lastEnd); // 完成的流量推进统一活动时钟
      tps = rows.length && ms > 0 ? tok / (ms / 1000) : null;
    }
  } catch (e) {
    /* silent by design: a dead server just means the cat keeps its last
       known mood; if it never spoke, the initial idle stands */
  }
  // Staleness guard: if the gen stream died right after a 'start', don't let
  // the cat run forever. 10 min without any gen event demotes to cruise —
  // long enough that a real marathon generation isn't visually cut short.
  if (gen && Date.now() - genLastAt > GEN_STALE) { gen = false; lanes = 0; }
  // idle demotion is time-based, so it must run even when the fetch failed
  render();
}

// ── generating flag: SSE /api/gen/events, event "gen" ─────────────────────
function openSSE() {
  try {
    es = new EventSource('/api/gen/events');
    es.addEventListener('gen', e => {
      let m; try { m = JSON.parse(e.data); } catch { return; }
      sseSeenEvent = true;
      genLastAt = Date.now();
      if (m.phase === 'start') { gen = true; lanes = Math.max(1, m.sessions || 1); lastActive = genLastAt; }
      else if (m.phase === 'lanes') { lanes = m.sessions || 0; lastActive = genLastAt; }
      else if (m.phase === 'end') {
        gen = false; lanes = 0;
        lastActive = Math.max(lastActive, genLastAt); // an end IS traffic
      }
      else if (m.phase === 'tool_error') {
        // 错误态接线：信号源是 server/livegen.js 的工具失败水位扫描（经
        // /api/gen/events SSE 透传，index.js 的 onEvent 原样转发）。failed 行
        // hold ERROR_HOLD_MS——优先级最高，生成中也被短暂盖过（见 computeMood）。
        lastActive = genLastAt; // 失败也是活动：惊醒
        errorHoldUntil = genLastAt + ERROR_HOLD_MS;
      }
      render();
    });
    // The endpoint may not exist yet. Native EventSource retries every ~3 s
    // forever; a source that never produced an event gets closed and retried
    // once a minute instead, so a permanent 404 stays silent instead of
    // hammering. Once it has produced events, trust the native reconnect.
    es.onerror = () => {
      if (!sseSeenEvent && es) { es.close(); es = null; setTimeout(openSSE, 60000); }
    };
  } catch { /* EventSource unavailable: pet lives on poll data alone */ }
}

poll();
setInterval(poll, 5000);
openSSE();
document.addEventListener('visibilitychange', () => {
  if (!document.hidden) { poll(); lastTs = 0; } // resync frame pacing after rAF pause
});

// ── frameless-window affordances (identical contract to widget.html) ──────
// Document-level listeners keep EVERY pixel of the card draggable; the canvas
// and bubble are pointer-events:none so nothing can swallow them.
if (IN_WEBVIEW) {
  document.addEventListener('pointerdown', e => {
    if (e.button === 0) window.chrome.webview.postMessage({ type: 'drag' });
  });
  document.addEventListener('contextmenu', e => {
    e.preventDefault();
    window.chrome.webview.postMessage({ type: 'menu', x: Math.round(e.screenX * (window.devicePixelRatio || 1)), y: Math.round(e.screenY * (window.devicePixelRatio || 1)) });
  });
  // wheel cycles the shell's three forms (胶囊/迷你/正常) — fastest switcher
  document.addEventListener('wheel', e => {
    e.preventDefault();
    window.chrome.webview.postMessage({ type: 'form-cycle', up: e.deltaY < 0 });
  }, { passive: false });
}

// ── 手势：双击/三击切包、≥4 击发脾气（连击 vs 切包冲突的解决方案）─────────
// 两手势共用同一串 click，冲突在判定层解决：窗口（GESTURE_WINDOW_MS）内累计
// 点击，窗口关闭时一次性判定——1 击无动作；2-3 击 switch（双击仍是切包，行为
// 与旧 dblclick 一致）；≥4 击 combo（发脾气 failed 行 COMBO_HOLD_MS，不切包）。
// 判定只产生一个动作，combo 消费掉这次手势，因此 4 连击不会顺带切包——两个
// 手势不再抢占同一输入。窗口 500ms ≈ Windows 默认双击时长，三连点仍落在窗口
// 内被判为 switch。
// 拖动排除：壳内 pointerdown 即 postMessage drag（窗口被壳拖走），松开仍会补发
// click；down→up 位移超 6px 的序列不计入手势，否则连续两次快速拖动会被误判为
// switch 而切包。本块 pointerdown/pointermove 只记录坐标、不发消息，与上方
// IN_WEBVIEW 的拖动/菜单/滚轮契约叠加不冲突。
// 监听挂 document（非 IN_WEBVIEW 独享）：浏览器直开 /pet 同样可双击切包。
let clickTimes = [], clickTimer = 0, downPt = null, dragMoved = false;
document.addEventListener('pointerdown', e => {
  if (e.button === 0) { downPt = { x: e.clientX, y: e.clientY }; dragMoved = false; }
});
document.addEventListener('pointermove', e => {
  if (downPt && (Math.abs(e.clientX - downPt.x) > 6 || Math.abs(e.clientY - downPt.y) > 6)) dragMoved = true;
});
document.addEventListener('click', e => {
  if (e.button !== 0) return;
  if (dragMoved) { dragMoved = false; return; } // 拖动后的补发 click 不计入手势
  lastActive = Date.now(); // 戳一下也是活动：惊醒/续命
  clickTimes.push(performance.now());
  if (!clickTimer) clickTimer = setTimeout(() => {
    const ts = clickTimes.slice().sort((a, b) => a - b);
    const n = ts.length ? ts.filter(t => t - ts[0] <= GESTURE_WINDOW_MS).length : 0;
    clickTimes = []; clickTimer = 0;
    if (n >= 4) {         // combo：发脾气，不切包
      comboHoldUntil = Date.now() + COMBO_HOLD_MS;
    } else if (n >= 2) {  // switch：双击/三击切下一个宠物
      cyclePack();
    }
    render();             // 发脾气立即上屏，不等下一次轮询
  }, GESTURE_WINDOW_MS);
});
</script>
</body>
</html>
