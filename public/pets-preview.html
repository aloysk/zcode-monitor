<!DOCTYPE html>
<!-- Candidate preview sheet: renders one idle frame (row 0, col 0) of each
     downloaded gallery candidate as a numbered card. Playwright screenshots
     this page into the contact sheet the user circles numbers on.
     The packs live under /pets-preview/<slug>/ (NOT /pets/ — the widget
     registry does not see them until promoted). -->
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>宠物候选预览</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: #1b1b1b;
    color: #f2f2f2;
    font-family: "Source Sans 3", "Noto Sans SC", "Segoe UI", "Microsoft YaHei", sans-serif;
    padding: 24px;
  }
  h1 { font-size: 18px; font-weight: 600; margin-bottom: 4px; }
  p.sub { font-size: 12px; color: #afafaf; margin-bottom: 18px; }
  .grid {
    display: grid;
    grid-template-columns: repeat(5, 1fr);
    gap: 14px;
  }
  .card {
    background: #242424;
    border: 1px solid #3a3a3a;
    border-radius: 10px;
    padding: 12px 10px 10px;
    text-align: center;
  }
  .num { font-size: 13px; font-weight: 700; color: #3b63fb; }
  canvas { height: 110px; image-rendering: auto; margin: 6px 0 4px; }
  .name { font-size: 13px; font-weight: 600; }
  .src { font-size: 11px; color: #afafaf; }
  /* 从暂存导入面板 */
  .import-panel { background: #242424; border: 1px solid #3a3a3a; border-radius: 10px;
    padding: 14px; margin-bottom: 20px; }
  .import-head { display: flex; align-items: center; gap: 10px; margin-bottom: 10px; flex-wrap: wrap; }
  .import-title { font-size: 14px; font-weight: 600; }
  .import-hint { font-size: 12px; color: #afafaf; flex: 1; }
  .import-head button { background: #3b63fb; color: #fff; border: 0; border-radius: 6px;
    padding: 5px 12px; font-size: 12px; cursor: pointer; }
  .import-list { list-style: none; display: flex; flex-wrap: wrap; gap: 8px; margin: 0 0 10px; padding: 0; }
  .import-list li { display: flex; align-items: center; gap: 6px; background: #1b1b1b;
    border: 1px solid #3a3a3a; border-radius: 6px; padding: 5px 8px; font-size: 12px; }
  .import-list button { background: #3b63fb; color: #fff; border: 0; border-radius: 5px;
    padding: 3px 10px; font-size: 12px; cursor: pointer; }
  .import-list button:disabled { background: #333; color: #888; cursor: not-allowed; }
  .import-empty { color: #afafaf; }
  .import-out { margin: 0; font-size: 12px; color: #afafaf; white-space: pre-wrap; min-height: 1.2em; }
</style>
</head>
<body>
<h1>宠物候选 · 第二批（跨站） · 圈选编号</h1>
<p class="sub">每只展示待机帧 · 来源横跨 petscodex / codex-pet.org / codex-pets.net / codex-pet.com(+petdex 精选) · 未进正式轮换</p>

<section class="import-panel">
  <div class="import-head">
    <strong class="import-title">从暂存导入</strong>
    <span class="import-hint">tools/pets-staging/ 下的包 → public/pets/&lt;id&gt;/，导入成功后进入正式轮换（/api/pets 可见）</span>
    <button id="staging-reload" type="button">刷新列表</button>
  </div>
  <ul class="import-list" id="staging-list"><li class="import-empty">加载中…</li></ul>
  <pre id="import-out" class="import-out"></pre>
</section>

<div class="grid" id="grid"></div>

<script>
'use strict';
// [slug, 名字, 域面 · 来源, 备注]
const CANDIDATES = [
  ['chiikawa',       '吉伊卡哇',   '吉祥物 IP · petscodex',  '现象级'],
  ['labubu',         'Labubu',    '潮玩 IP · petscodex',    '全球爆火'],
  ['moo-deng',       '弹跳小河马', '动物 meme · petscodex',  '病毒式'],
  ['kemusan-dancer', '科目三舞者', '热梗 · petscodex',       '真人形象'],
  ['usagi',          '兔兔乌萨吉', '吉祥物 IP · petscodex',  '吉伊卡哇一家'],
  ['tailmon',        '迪路兽',     '数码宝贝 · codex-pets.net', '经典'],
  ['gundam-aerial',  '风灵高达',   '机甲 · codex-pets.net',  '水星魔女'],
  ['lovvy',          'Lovvy',      'Lovable 官方 · codex-pets.net', '编程吉祥物'],
  ['doraemon',       '哆啦A梦',    '经典 · codex-pet.com+petdex', '双站精选'],
  ['eve',            'EVE',        'WALL·E · codex-pet.com+petdex', '双站精选'],
];
const CW = 192, CH = 208;
const grid = document.getElementById('grid');
// settled 而非 loaded：缺图包画占位后也算就绪，联系表截图流程不被单个坏包挂死
let settled = 0;
CANDIDATES.forEach(([slug, name, src, rank], i) => {
  const card = document.createElement('div');
  card.className = 'card';
  card.innerHTML = '<div class="num">#' + (i + 1) + '</div>';
  const cv = document.createElement('canvas');
  cv.width = 204; cv.height = 220;
  card.appendChild(cv);
  const nm = document.createElement('div'); nm.className = 'name'; nm.textContent = name;
  const sc = document.createElement('div'); sc.className = 'src'; sc.textContent = src + ' · ' + rank;
  card.appendChild(nm); card.appendChild(sc);
  grid.appendChild(card);
  const im = new Image();
  im.onload = () => {
    const ctx = cv.getContext('2d');
    ctx.imageSmoothingQuality = 'high';
    ctx.drawImage(im, 1, 1, CW - 2, CH - 2, 0, 0, cv.width, cv.height);
    settled++;
  };
  // 缺图占位：候选包未下载/损坏时明确标出，别让卡片静默空白
  im.onerror = () => {
    const ctx = cv.getContext('2d');
    ctx.fillStyle = '#2e2e2e';
    ctx.fillRect(0, 0, cv.width, cv.height);
    ctx.strokeStyle = '#4a4a4a';
    ctx.strokeRect(6.5, 6.5, cv.width - 13, cv.height - 13);
    ctx.fillStyle = '#9a9a9a';
    ctx.font = '12px "Segoe UI", "Microsoft YaHei", sans-serif';
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillText('缺图 · ' + slug, cv.width / 2, cv.height / 2);
    settled++;
  };
  im.src = '/pets-preview/' + slug + '/spritesheet.webp';
});
window.__previewReady = () => settled === CANDIDATES.length;
</script>

<script>
'use strict';
// 从暂存导入：GET /api/pets/staging 列包 → 点击调 POST /api/pets/import。
// 导入端点要求自定义首部 X-Zcode-Monitor-Import: 1（跨源简单 POST 带不了，缺了服务端 403）。
async function loadStaging() {
  const list = document.getElementById('staging-list');
  try {
    const r = await fetch('/api/pets/staging');
    const packs = await r.json();
    list.innerHTML = '';
    if (!packs.length) {
      list.innerHTML = '<li class="import-empty">staging 目录为空或不存在（tools/pets-staging/）</li>';
      return;
    }
    for (const p of packs) {
      const li = document.createElement('li');
      const btn = document.createElement('button');
      btn.type = 'button';
      btn.textContent = p.hasPetJson ? '导入' : '缺 pet.json';
      btn.disabled = !p.hasPetJson;
      btn.addEventListener('click', () => importPack(p.id));
      const label = document.createElement('span');
      label.textContent = p.id + ' · ' + p.name;
      li.appendChild(btn);
      li.appendChild(label);
      list.appendChild(li);
    }
  } catch (e) {
    list.innerHTML = '<li class="import-empty">列表加载失败: ' + e.message + '</li>';
  }
}
async function importPack(source) {
  const out = document.getElementById('import-out');
  out.textContent = '导入中: ' + source + ' …';
  try {
    const r = await fetch('/api/pets/import', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json', 'X-Zcode-Monitor-Import': '1' },
      body: JSON.stringify({ source }),
    });
    const j = await r.json();
    out.textContent = (r.ok && j.ok)
      ? '导入成功: ' + j.id + ' → ' + j.dir
        + (j.warnings && j.warnings.length ? '（警告: ' + j.warnings.join(', ') + '）' : '')
      : '失败 [' + j.error + ']: ' + j.message;
    if (r.ok && j.ok) loadStaging();
  } catch (e) {
    out.textContent = '请求失败: ' + e.message;
  }
}
document.getElementById('staging-reload').addEventListener('click', loadStaging);
loadStaging();
</script>
</body>
</html>
