<!DOCTYPE html>
<!-- token-speed floating widget — pill edition.
     One line: tier-colored number · unit — plus a quiet accent "×N" badge
     while ≥2 sessions generate concurrently (N = live lanes; tps × N ≈
     aggregate burn, the number itself stays per-lane).
     Number = rolling weighted tps over requests COMPLETED in the last 5
     minutes: seeded from /api/widget/recent (the exact window population),
     then live completed requests via SSE /api/live/events 'model'.
     Caliber: Σ(output+reasoning) ÷ Σ GENERATION ms (duration − TTFT, the
     time before the first token — GLM-5.3's thinking wait averages 8.7s
     = 39% of duration, incl-TTFT would read ~40% low; TTFT-less rows fall
     back to full duration, matching server db.js Token speed header).
     Idle → "—". One decimal always shown (56.0, not 56).
     States: ok (number, tier color) · idle (—, dim) · error (—, red brand).
     Texture, not new elements: a 30×10s micro-sparkline of the same rolling
     window hides behind the number at 45% tier color; while a generation is
     in flight (/api/gen/events) the number's color breathes ±12% lightness;
     hovering 400ms surfaces today's usage in a card tooltip above the pill.
     Shell window: 240×56 physical = 120×28 CSS px at 200% DPI. The window
     region shapes the pill, so the body paints full-bleed with no border
     or radius of its own.
     Affordances: drag anywhere · right-click menu · double-click dashboard. -->
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Token 速度</title>
<style>
/* Spectrum 2 tokens (subset, from Ke-Spectrum-2-Design-System/tokens/) */
:root {
  color-scheme: light dark;
  --font-sans: "Source Sans 3", "Noto Sans SC", ui-sans-serif, system-ui, "Segoe UI", "Microsoft YaHei", sans-serif;
  --font-code: "Source Code Pro", ui-monospace, Consolas, monospace;

  --surface-card: light-dark(#ffffff, #222222);
  --text-heading: light-dark(#131313, #f2f2f2);
  --text-secondary: light-dark(#505050, #afafaf);
  --text-disabled: light-dark(#8f8f8f, #6d6d6d);
  --negative: light-dark(#d73220, #df3422);
  --accent: light-dark(#3b63fb, #8ea5fb); /* Spectrum 2 blue — the ×N lane badge */
  /* --notice 浅色档是该数字在白底的唯一速度读数：#fc7d00 对白底仅 ~2.6:1，
     加深到 #b35600（~4.9:1，AA）；深色档 #e06400 本就 ~4.6:1，不动 */
  --notice: light-dark(#b35600, #e06400);
  --positive: light-dark(#05834e, #068850);
}
/* 字体走 --font-sans 系统栈，零外联（R-8 已决：系统字体为最终形态；
   原 @import 排在 :root 之后本就无效，删除后语义不变） */

* { margin: 0; padding: 0; box-sizing: border-box; }
html, body { height: 100%; overflow: hidden; }
body {
  position: relative; /* containing block for the absolutely-placed sparkline */
  background: var(--surface-card); /* full-bleed: the shell's window region shapes the pill */
  font-family: var(--font-sans);
  -webkit-font-smoothing: antialiased; /* kills ClearType color fringing on the small gray unit */
  user-select: none;
  -webkit-user-select: none;
  cursor: default;
  display: flex;
  align-items: center;
  /* left-anchored, not centered: the tabular number's glyphs are fixed-width,
     so its start position NEVER moves when digits/lanes change; the ×N badge
     appends at the text tail. Centering would re-center the whole line every
     time a lane joins/leaves mid-battle — a hop every few seconds reads cheap. */
  justify-content: flex-start;
  /* right side is the sparkline's reserved zone (12px inset + 44px chart):
     the centered number+unit can never collide with the stroke — vision
     review caught the unit glyphs sitting inside the polyline's span */
  padding: 0 58px 0 14px;
  white-space: nowrap;
}
/* one baseline for both text parts — mixed font sizes otherwise drift apart.
   gap 0 + .unit margin keeps the unit 4px off its number: a 9-13px gap read
   as a break and visually re-grouped "t/s" with the sparkline instead */
.row { display: inline-flex; align-items: baseline; gap: 0; }
.tps {
  font-family: var(--font-sans);
  font-variant-numeric: tabular-nums;
  font-weight: 600;
  font-size: 15px;
  line-height: 1;
  color: var(--text-disabled); /* idle baseline; tiers below override */
}
/* speed tiers mirror the dashboard KPI convention: <30 red / 30-80 notice / >80 green
   (authoritative note: server/db.js Token speed header).
   Thresholds unchanged by the 2026-09 TTFT-stripped caliber: generation-time
   <30 t/s is still genuinely slow and >80 still fast (measured mean 94 /
   weighted 78 on GLM-5.3); token-speed-monitor's <40-green ladder is an
   incl-TTFT caliber and not comparable. */
.spd-red    { color: var(--negative); }
.spd-yellow { color: var(--notice); }
.spd-green  { color: var(--positive); }
.tps.err    { color: var(--negative); } /* server unreachable — distinct from idle gray */
.unit {
  font-family: var(--font-sans);
  font-size: 10px; /* ~67% of the number — a quiet qualifier, not a co-headline */
  font-weight: 500;
  color: var(--text-disabled);
  margin-left: 3px; /* 3px internal rhythm leaves ≥5px to the sparkline (vision-caught: at 4px the badge grazed it) */
}
/* concurrent-lane badge: "×5" while ≥2 sessions generate at once. Inline at
   the text tail — the line is left-anchored and digits are tabular, so the
   number's position is invariant when the badge appears/disappears.
   Single-lane and idle stay visually silent. A very wide number (100+ tps
   WITH 10+ lanes) may graze the 45%-opacity sparkline — accepted: per-lane
   tps stays 2-digit in exactly the multi-lane regime. */
.lanes {
  font-family: var(--font-sans);
  font-variant-numeric: tabular-nums;
  font-size: 10px;
  font-weight: 600;
  color: var(--accent);
  margin-left: 3px; /* matches .unit — one rhythm for all qualifiers */
}

/* micro-sparkline: pure texture beside the number. The tier classes above
   supply its color via currentColor. The old 45% stroke read as washed-out
   peach next to the 600-weight number — 70% keeps it subordinate but alive.
   The svg BOX centers on the text ink line (the visible polyline wanders
   inside it with the data — that's shape, not misalignment).
   44×12 drawn 1:1 with its viewBox so the 1.5px stroke never distorts. */
.spark {
  position: absolute;
  right: 12px;
  top: 50%;
  transform: translateY(-50%);
  width: 44px;
  height: 12px;
  pointer-events: none; /* never a hit target: drag must be able to start anywhere */
}
.spark.off { display: none; }
.spark polyline {
  fill: none;
  stroke: currentColor;
  stroke-width: 1.5;
  stroke-opacity: 0.7;
  stroke-linecap: round;
  stroke-linejoin: round;
}
/* live-end dot: solid r=2 — a deliberate current-value marker, not a smear */
.spark circle { fill: currentColor; fill-opacity: 1; }

/* generation in flight: ONE indicator — the number's color breathes
   (±12% lightness, 2s ease cycle). Chosen over a 4px status dot: at 28px
   window height a third element reads as clutter, while modulating the
   color of an element that already exists reads as state, not content. */
body.gen .tps { animation: gen-breathe 2s ease-in-out infinite alternate; }
@keyframes gen-breathe {
  from { filter: brightness(0.88); }
  to   { filter: brightness(1.12); }
}

/* hover tooltip (today's usage): S2 card above the pill, centered. Fixed
   placement + pointer-events:none keep the frameless drag (pointerdown
   anywhere, including through this card) completely untouched. Card chrome
   is derived from existing tokens only (color-mix for hairline + shadow,
   shadow tinted toward the text hue, never raw black). */
.tip {
  position: fixed;
  bottom: calc(100% + 6px);
  left: 50%;
  transform: translateX(-50%);
  background: var(--surface-card);
  color: var(--text-secondary);
  font-size: 11px;
  line-height: 1;
  padding: 5px 8px;
  border-radius: 6px;
  border: 1px solid color-mix(in srgb, var(--text-disabled) 35%, transparent);
  box-shadow: 0 2px 8px color-mix(in srgb, var(--text-heading) 15%, transparent);
  white-space: nowrap;
  pointer-events: none;
  z-index: 10;
}

/* C8 notify 临时副行：速度数字行下方的窗体常驻副行容器（本批新增 UI 形态，
   非 .tip 通道复用——.tip 是 hover 400ms 悬浮卡，用户不在屏幕前时不可见，
   而 C8 用户故事恰是「不在屏幕前时提醒才有意义」）。absolute 叠加锚数字行
   下方空带（15px 数字行居中于 28px 窗，下带贴放 8.5px 副行，ink 不相犯），
   初始 display:none；不弹窗、不加宽窗体（胶囊单行窗左锚定+nowrap 契约
   不动）；severity 语义色经 Spectrum 变量映射（零硬编码色值）。文本写入
   一律 textContent（.tip 同款渲染纪律）。出现后 8s 淡出、多条只显最新。 */
.notify-row {
  position: absolute;
  left: 14px;                        /* 与 .row 同左锚（数字起点不变契约） */
  top: 17.5px;
  font-family: var(--font-sans);
  font-size: 8.5px;
  line-height: 1;
  white-space: nowrap;
  overflow: hidden;
  max-width: calc(100% - 72px);      /* 右侧 sparkline 保留区不侵占 */
  opacity: 0;
  transition: opacity .4s ease;
  pointer-events: none;              /* never a hit target（.spark 同款纪律） */
}
.notify-row.on { opacity: 1; }

@media (prefers-reduced-motion: reduce) {
  body.gen .tps { animation: none; } /* breathing is ambient, not informational */
  .notify-row { transition: none; }  /* 淡出是氛围过渡：削减动效时直切 */
}
</style>
</head>
<body>
  <span class="row"><span class="tps" id="tps">—</span><span class="unit" id="unit" hidden>t/s</span><span class="lanes" id="lanes" hidden></span></span>
  <svg class="spark off" id="spark" width="44" height="12" viewBox="0 0 44 12" aria-hidden="true" focusable="false">
    <polyline id="sparkLine"></polyline>
    <circle id="sparkDot" r="2"></circle>
  </svg>
  <div class="tip" id="tip" hidden></div>
  <div class="notify-row" id="notify-row"></div>

<!-- 消毒模块：气泡类展示（悬浮 tip）的文本闸门，加载失败时展示点回退原文不致崩页 -->
<script src="/sanitize.js"></script>
<script>
'use strict';
const IN_WEBVIEW = !!(window.chrome && window.chrome.webview);
const ROLL_MS = 5 * 60 * 1000;   // rolling window for the real-time number
const SLOTS = 30, SLOT_MS = 10000; // sparkline granularity: 30×10s = the same 5 min
const SPARK_W = 44, SPARK_H = 12;

const $ = id => document.getElementById(id);
function speedClass(tps) {
  if (tps == null || !isFinite(tps)) return '';
  if (tps < 30) return 'spd-red';
  if (tps <= 80) return 'spd-yellow';
  return 'spd-green';
}

// Rolling request buffer, keyed by COMPLETION time (started_at + duration_ms):
// rows land in db.sqlite only when a request finishes, so started_at-keying
// evicted a request longer than the window before it ever arrived, and a long
// request whose start predates the window legitimately belongs in "recent".
// Entries: {end: epoch ms, tok, genMs, id} — genMs is GENERATION time
// (duration − TTFT), the speed denominator; `end` still uses full duration
// because it is completion-time bookkeeping, not a speed input. `seen` dedups
// the seed (60s re-fetch of the same rows) against already-buffered SSE
// events; ids leave with their entry so the set stays window-sized.
const buf = [];
const seen = new Set();
function pushReq(id, endMs, tok, genMs) {
  if (!(endMs > 0) || !(tok >= 0) || !(genMs > 0)) return;
  if (endMs <= Date.now() - ROLL_MS) return; // completed before the window opened
  if (id != null) {
    if (seen.has(id)) return;
    seen.add(id);
  }
  buf.push({ end: endMs, tok, genMs, id });
}

// Micro-sparkline: rebuilt from buf on every render (each 2s tick, every seed,
// every SSE bump), so the series backfills automatically after page load and
// self-heals with the 15s re-seed. Each slot aggregates only the completions
// that fell inside its own 10s span; empty slots are skipped and the line
// connects THROUGH them — plotting them as zero would fabricate "0 t/s" for
// idle minutes that never had a measurement.
function drawSpark(tier) {
  const svg = $('spark');
  if (!tier) { svg.setAttribute('class', 'spark off'); return; }
  // Epoch-aligned slot indices (not "now minus k×10s") dodge boundary
  // off-by-ones; slot 29 is the CURRENT partial slot, which is what makes
  // the live-end dot move as rows arrive mid-slot.
  const cur = Math.floor(Date.now() / SLOT_MS);
  const agg = new Array(SLOTS).fill(null);
  for (const r of buf) {
    const i = Math.floor(r.end / SLOT_MS) - cur + SLOTS - 1;
    if (i < 0 || i >= SLOTS) continue; // rows straddling the window edge: render() evicts, guard anyway
    const s = (agg[i] ??= { tok: 0, ms: 0 });
    s.tok += r.tok;
    s.ms += r.genMs;
  }
  const v = new Array(SLOTS).fill(null);
  let max = 0, last = -1, n = 0;
  for (let i = 0; i < SLOTS; i++) {
    const s = agg[i];
    if (s && s.ms > 0) {
      v[i] = s.tok / (s.ms / 1000);
      if (v[i] > max) max = v[i];
      last = i;
      n++;
    }
  }
  // a single populated slot is a lone dot, not a line; an all-zero window
  // has no scale to draw against
  if (max <= 0 || n < 2) { svg.setAttribute('class', 'spark off'); return; }
  const pts = [];
  for (let i = 0; i <= last; i++) {
    if (v[i] == null) continue;
    pts.push((i / (SLOTS - 1) * SPARK_W).toFixed(2) + ',' +
             (SPARK_H - 1 - (v[i] / max) * (SPARK_H - 2)).toFixed(2)); // 1px inset keeps the stroke inside
  }
  $('sparkLine').setAttribute('points', pts.join(' '));
  const [dx, dy] = pts[pts.length - 1].split(',');
  $('sparkDot').setAttribute('cx', dx);
  $('sparkDot').setAttribute('cy', dy);
  svg.setAttribute('class', 'spark ' + tier); // tier classes carry the color via currentColor
}

function render() {
  const now = Date.now();
  const cutoff = now - ROLL_MS;
  // full pass, NOT a front-only loop: buf is appended in started_at order
  // (seed) / arrival order (SSE), which is not completion-time order — a
  // front-only evict let short rows linger behind a long row for minutes
  for (let i = 0; i < buf.length; )
  {
    if (buf[i].end < cutoff)
    {
      const [gone] = buf.splice(i, 1);
      if (gone.id != null) seen.delete(gone.id);
    }
    else i++;
  }
  if (!buf.length) {
    $('tps').textContent = '—';
    $('tps').className = 'tps';
    $('unit').hidden = true;
    drawSpark(null);
    return;
  }
  let tok = 0, ms = 0;
  for (const r of buf) { tok += r.tok; ms += r.genMs; }
  // weighted aggregate over the window — same caliber as the dashboard KPI:
  // Σ(output+reasoning) ÷ Σ GENERATION ms (completed only, TTFT stripped)
  const text = ms > 0 ? (tok / (ms / 1000)).toFixed(1) : null;
  const tier = speedClass(text != null ? parseFloat(text) : null);
  $('tps').textContent = text != null ? text : '—';
  $('tps').className = 'tps ' + tier;
  $('unit').hidden = text == null;
  drawSpark(tier);
}

// seed = the exact rolling-window population (completed in the last 5 min,
// uncapped), then keep rolling via SSE; re-fetch also self-heals SSE gaps
async function seed() {
  try {
    const r = await fetch('/api/widget/recent', { cache: 'no-store' });
    if (!r.ok) throw new Error('http ' + r.status);
    const d = await r.json();
    for (const q of d) // bare array of window rows — see server completedSince
      pushReq(q.id,
              new Date(q.time).getTime() + q.duration_ms,
              (q.output || 0) + (q.reasoning || 0),
              q.gen_ms || q.duration_ms); // gen_ms: duration−ttft (db.js caliber)
    render();
  } catch (e) {
    if (buf.length) return; // keep the last good number; the 15s retry owns recovery
    $('tps').textContent = '—';
    $('tps').className = 'tps err';
    $('unit').hidden = true;
    drawSpark(null); // the error state owns the surface: no stale texture
  }
}

// ── C8 notify 消费：数字行下方临时副行 ──────────────────────────────────
// 挂在既有 /api/live/events 连接上（addEventListener('notify')，零新连接）。
// 降级矩阵三页统一语义（app.js notifyChannels 注释钉）：本页通道子集＝副行
// 恒在的底线通道、不受三开关控制——胶囊窗纯视觉（提示音/系统通知/TTS 不在
// 本页发：声音与系统通知由面板/桌宠页承载，避免多页同开重复打扰）。幂等
// 去重双保险（服务端冷却之外）按载荷 id 有界记忆（app.js 同款、内联同语义
// 实现——本页不引 app.js）。
const notifySeen = new Map();
const NOTIFY_SEEN_CAP = 200;
function notifyDuplicate(id) {
  if (id == null) return false;
  if (notifySeen.has(id)) return true;
  notifySeen.set(id, Date.now());
  if (notifySeen.size > NOTIFY_SEEN_CAP) notifySeen.delete(notifySeen.keys().next().value);
  return false;
}
const notifyRow = $('notify-row');
let notifyTimer = 0;
function onNotify(e) {
  let n; try { n = JSON.parse(e.data); } catch { return; }
  if (!n || typeof n !== 'object' || notifyDuplicate(n.id)) return;
  // 文本一律 textContent 写入（tip.textContent 同款渲染纪律——防注入真闸门；
  // sanitize.js 是隐私剥除闸、非 HTML 消毒器，两闸正交缺一不可）。body 含
  // 库内字符串（会话标题等，服务端生成仍视为不可信输入）。
  const raw = `${n.title || n.rule}：${n.body || ''}`;
  notifyRow.textContent = window.SanitizeSpeech ? window.SanitizeSpeech.sanitizeSpeech(raw) : raw;
  // severity→语义色经 Spectrum 变量（err=--negative / warn=--notice / ok=--positive）
  notifyRow.style.color = n.severity === 'err' ? 'var(--negative)'
    : n.severity === 'warn' ? 'var(--notice)' : 'var(--positive)';
  notifyRow.classList.add('on');
  clearTimeout(notifyTimer); // 多条只显最新一条：覆盖文本 + 重置驻留计时
  notifyTimer = setTimeout(() => notifyRow.classList.remove('on'), 8000);
}

let bump = null;
try {
  const es = new EventSource('/api/live/events');
  es.addEventListener('model', e => {
    const m = JSON.parse(e.data);
    // completed only — error/cancelled rows carry duration but no real output
    // and would drag the weighted aggregate down (matches server recentSpeed)
    if (m.status !== 'completed' || !(m.duration_ms > 0)) return;
    // gen = duration − TTFT (null → full duration); 1ms floor matches server
    pushReq(m.id,
            new Date(m.started_at).getTime() + m.duration_ms,
            (m.output_tokens || 0) + (m.reasoning_tokens || 0),
            Math.max(m.duration_ms - (m.time_to_first_token_ms || 0), 1));
    clearTimeout(bump);
    bump = setTimeout(render, 200); // coalesce bursts
  });
  // C8 notify 帧：同一连接上的第二事件类型（服务端 notify.js 规则引擎经
  // live.js 转发）。连接失败静默——EventSource 原生重连，速度读数有 15s
  // re-seed 兜底，副行本就是即到即显的瞬时通道（notify 即发即失、不回放）。
  es.addEventListener('notify', onNotify);
} catch {}

// ── generation breathing + concurrent-lane badge ──
// 'start'/'end' are boolean edges; 'lanes' fires whenever the concurrent
// session count CHANGES mid-generation. lanes ≥ 2 surfaces the ×N badge
// (per-lane tps × N ≈ aggregate burn); single-lane generating stays
// visually silent. Estimates never overwrite the exact rolling number.
let lanes = 0;
const syncGen = () => {
  document.body.classList.toggle('gen', lanes > 0);
  const show = lanes >= 2;
  const el = $('lanes');
  el.hidden = !show;
  if (show) el.textContent = '×' + lanes;
};
try {
  const ges = new EventSource('/api/gen/events');
  ges.addEventListener('gen', e => {
    try {
      const m = JSON.parse(e.data);
      if (m.phase === 'start') lanes = Math.max(1, m.sessions || 1);
      else if (m.phase === 'lanes') lanes = m.sessions || 0;
      else if (m.phase === 'tool_error') return; // 工具失败边（livegen 水位扫描）不是生成结束：落进
                                                 // else 会把呼吸与 ×N 徽章清零、直到下一条边
                                                 // 才恢复（pet.html 的同款分派显式处理该 phase）
      else lanes = 0; // 'end'
      syncGen();
    } catch {}
  });
  // connection lost → drop to no-breathing and stay silent: stream state is
  // unknown, and an unreachable endpoint must degrade without any UI noise
  ges.addEventListener('error', () => { lanes = 0; syncGen(); });
} catch {}

// ── hover tooltip: today's usage ──
// Fetched on first qualifying hover, cached 60s. Failures (e.g. the endpoint
// not existing yet) show nothing and are retried on the next hover. The card
// is pointer-events:none and appears only after a 400ms mouse dwell, so the
// drag handler's document-level pointerdown never sees it as a target.
const tip = $('tip');
const TIP_TTL = 60000;
let tipTimer = 0, tipCache = null, tipBusy = false, tipOver = false;
const fmtWan = n => n >= 10000 ? (n / 10000).toFixed(1) + '万' : String(n);
async function showTip() {
  let text = tipCache && Date.now() - tipCache.at < TIP_TTL ? tipCache.text : null;
  if (!text && !tipBusy) {
    tipBusy = true; // one fetch at a time; a concurrent hover reuses its result via the cache
    try {
      const r = await fetch('/api/widget/today', { cache: 'no-store' });
      if (!r.ok) throw new Error('http ' + r.status);
      const d = await r.json();
      if (!Number.isFinite(d.tokens) || !Number.isFinite(d.requests)) throw new Error('shape');
      // C2 缓存命中副行（纯渲染）：比率在响应侧算好（cache_hit_rate =
      // cache_read/input，input 官方语义已含 cache_read；当日全零行日分母为 0 →
      // 服务端返回 null）——null/undefined 一律显示「—」（共享 formatter null
      // 语义），本处不计算比率，禁 NaN/Infinity 上屏。
      const hit = d.cache_hit_rate == null ? '—' : Math.round(d.cache_hit_rate * 100) + '%';
      text = '今日 ' + fmtWan(d.tokens) + ' tok · ' + d.requests + ' 次 · 缓存命中 ' + hit;
      tipCache = { text, at: Date.now() };
    } catch {} // silent by contract: no data yet → no tooltip
    tipBusy = false;
  }
  // 气泡类展示点统一过消毒闸（sanitize.js）；模块缺失时回退原文，保页面不崩
  if (text && tipOver) {
    tip.textContent = window.SanitizeSpeech ? window.SanitizeSpeech.sanitizeSpeech(text) : text;
    tip.hidden = false;
  } // pointer may have left during await
}
document.body.addEventListener('pointerenter', e => {
  if (e.pointerType !== 'mouse') return; // touch "hover" is a tap, not dwell intent
  tipOver = true;
  clearTimeout(tipTimer);
  tipTimer = setTimeout(showTip, 400);
});
document.body.addEventListener('pointerleave', () => {
  tipOver = false;
  clearTimeout(tipTimer);
  tip.hidden = true;
});
document.addEventListener('pointerdown', () => {
  clearTimeout(tipTimer); // drag/menu start from a clean surface
  tip.hidden = true;
});

seed();
setInterval(render, 2000);    // 2s cadence: the sliding window decay must feel alive
setInterval(seed, 15000);     // self-heal: SSE watermark misses rows that were
                              // in-flight when the server booted; 15s bounds it
document.addEventListener('visibilitychange', () => { if (!document.hidden) seed(); });

// ── frameless-window affordances (only meaningful inside the WebView2 shell) ──
if (IN_WEBVIEW) {
  document.addEventListener('pointerdown', e => {
    if (e.button === 0) window.chrome.webview.postMessage({ type: 'drag' });
  });
  document.addEventListener('contextmenu', e => {
    e.preventDefault();
    window.chrome.webview.postMessage({ type: 'menu', x: Math.round(e.screenX * (window.devicePixelRatio || 1)), y: Math.round(e.screenY * (window.devicePixelRatio || 1)) });
  });
  document.addEventListener('dblclick', () => {
    window.chrome.webview.postMessage({ type: 'open-dashboard' });
  });
  // wheel cycles the shell's three forms (胶囊/迷你/正常) — same contract
  // as pet.html, so the gesture works identically on every form
  document.addEventListener('wheel', e => {
    e.preventDefault();
    window.chrome.webview.postMessage({ type: 'form-cycle', up: e.deltaY < 0 });
  }, { passive: false });
}
</script>
</body>
</html>
